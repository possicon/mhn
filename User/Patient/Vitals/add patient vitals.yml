info:
  name: add patient vitals
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/patient/vitals"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"height_in_feet\":\"65\",\r

      \    \"height_in_inch\":\"50\",\r

      \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\",\r

      \    \"diastolic\":\"34\",\r

      \    \"bmi\":\"90\",\r

      \    \"weight\":\"250\",\r

      \    \"temperature\":\"46\",\r

      \    \"blood_pressure\":\"80\",\r

      \    \"complaints\":\"High appetite for food\",\r

      \    \"for_antenatal\":1,\r

      \    \"respiratory_rate\":\"46\", // if for_antenatal is 1\r

      \    \"pulse_in_bps\":\"67\", // if for_antenatal is 1\r

      \    \"oxygen_saturation_level\":\"20\", // if for_antenatal is 1\r

      \    \"fatal_heart_rate\":\"56\", // if for_antenatal is 1\r

      \    \"random_blood_sugar\":\"75\", // if for_antenatal is 1\r

      \    \"fasting_blood_sugar\":\"56\" // if for_antenatal is 1\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: add patient vitals
    request:
      url: "{{base_url}}/user/patient/vitals"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"height_in_feet\":\"65\",\r

          \    \"height_in_inch\":\"50\",\r

          \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\",\r

          \    \"diastolic\":\"34\",\r

          \    \"bmi\":\"90\",\r

          \    \"weight\":\"250\",\r

          \    \"temperature\":\"46\",\r

          \    \"blood_pressure\":\"80\",\r

          \    \"complaints\":\"High appetite for food\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Mon, 27 May 2024 21:53:44 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1q mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.16
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "You have successfully added vitals",
              "data": null
          }

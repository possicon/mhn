info:
  name: Add drug history
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/patient/drug_history"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"drug_name\":[\"Paraetamol\",\"Vitamin C\"],\r

      \    \"frequency\":[\"Daily\",\"Weekends\"],\r

      \    \"is_still_in_use\":[1,0],\r

      \    \"usage_period\":[\"01-04-2022 - 02-06-2023\",\"03-04-2022 - 05-07-2024\"],\r

      \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{base_url}}/user/patient/drug_history"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"drug_name\":[\"Paraetamol\",\"Vitamin\"],\r

          \    \"frequency\":[\"Daily\",\"Weekends\"],\r

          \    \"is_still_in_use\":[1,0],\r

          \    \"usage_period\":[\"2022-2023\",\"2022-2024\"],\r

          \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Tue, 21 May 2024 13:03:55 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1q mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.16
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "You have successfully added patient drug history",
              "data": null
          }

info:
  name: admission
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/user/patient/treatment_intervention"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"treatment_plan\":\"treatment and refer\", //, treatment only , treatment and refer\r

      \    \"patient_id\":\"9ea8d8a4-2cdd-4e08-baaf-a2d7048f8a32\",\r

      \    \"appointment_id\":\"9e94856d-c5f3-4bdd-a450-23aedb006ade\",\r

      \    \"procedures\":0, //required if treatment is treatment only or treatment and refer\r

      \    \"prescription\":0,\r

      \    \"programs\":0,\r

      \    \"admission\":1,\r

      \    \"followup\":0,\r

      \    \"ward\":\"9ed142cb-16ec-41b5-928e-2478c81e4abc\",\r

      \    \"bed_number\":\"9f38f2de-3a86-415c-bc07-b30f5bb36e30\",\r

      \    \"instruction_for_wards\":\"instruction_for_wards\"\r

      \    //\"room\":\"9ec6ba34-ed06-44ca-8bed-3ac00cf304ae\"\r

      \r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: admission
    request:
      url: "{{base_url}}/user/patient/treatment_intervention"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"treatment_plan\":\"treatment and refer\", //, treatment only , treatment and refer\r

          \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\",\r

          \    \"procedures\":0, //required if treatment is treatment only or treatment and refer\r

          \    \"prescription\":0,\r

          \    \"programs\":0,\r

          \    \"admission\":1,\r

          \    \"followup\":0,\r

          \    \"wards\":\"select ward\",\r

          \    \"bed_number\":\"bed_number\",\r

          \    \"instruction_for_wards\":\"instruction_for_wards\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date

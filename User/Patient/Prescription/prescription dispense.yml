info:
  name: prescription dispense
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/user/prescription/:prescription"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: prescription
      value: a1442957-1674-4829-9e41-43980ae39dba
      type: path
  body:
    type: json
    data: "{\r

      \    \"note\":\"dispense note if there is any\",\r

      \    \"medicines\" : [\r

      \        {\r

      \            \"id\" : \"a1442d62-9ec8-42a9-857a-5720f66bc5a5\",\r

      \            \"quantity\" : 30,\r

      \            \"note\" : \"{{$randomLoremSentence}}\"\r

      \        }\r

      \    ]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


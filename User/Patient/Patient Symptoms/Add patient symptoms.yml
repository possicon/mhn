info:
  name: Add patient symptoms
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/patient/symptoms"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
         "patient_id":"a134bd94-4206-44a3-8038-51e0328a3df0",
         "appointment_id" : "a14427af-e505-4c40-a7ad-6c2bcbf8ff75",
         "primary": ["icd10"],
          "body_parts" : [
              {
                "body_part" : "Head:Front/Side",
                "any_current_symptoms_or_concern" : "symptoms",
                "occurrence" : "Frequently",
                "note" : "{{$randomWords}}",
                "symptoms" : ["a2788e8c-8941-41cd-8bb0-26722846c41e", "a2788e8c-9136-475b-92ac-c15e7699e24a"]
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: sample
    request:
      url: "{{base_url}}/user/patient/symptoms"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
             "patient_id":"a134bd94-4206-44a3-8038-51e0328a3df0",
             "appointment_id" : "a14427af-e505-4c40-a7ad-6c2bcbf8ff75",
             "primary": ["icd10"],
              "body_parts" : [
                  {
                    "body_part" : "Head:Front/Side",
                    "any_current_symptoms_or_concern" : "symptoms",
                    "occurrence" : "Frequently",
                    "note" : "{{$randomWords}}",
                    "symptoms" : ["a2788e8c-8941-41cd-8bb0-26722846c41e", "a2788e8c-9136-475b-92ac-c15e7699e24a"]
                  }
              ]
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 26 Aug 2026 09:21:40 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "59"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "success": true,
            "code": 0,
            "locale": "en",
            "message": "You have successfully added symptoms",
            "data": null
          }

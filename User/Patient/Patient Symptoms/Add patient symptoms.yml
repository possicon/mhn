info:
  name: Add patient symptoms
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/patient/symptoms"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"body_parts\":[\"Head:Front/Side\",\"Neck:Front\"],\r

      \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\",\r

      \    \"symptoms\":[[\"Fever,Headache,High Cholesterol\"],[\"Fever\",\"Diabetes\"]],\r

      \    \"occurrence\":[\"occasionally\",\"Daily\"],\r

      \    \"note\":[\"Happens when i sleep too much without pillow\",\"I barely rest\"],\r

      \    \"for_antenatal\":0,\r

      \    \"primary\":\"icd10\"\r

      \   // \"any_current_symptoms_or_concern\":[\"symptoms\",\"symptoms\"]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Add patient symptoms
    request:
      url: "{{base_url}}/user/patient/symptoms"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"body_parts\":[\"Head:Front/Side\",\"Neck:Front\"],\r

          \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\",\r

          \    \"symptoms\":[[\"Fever,Headache,High Cholesterol\"],[\"Fever\",\"Diabetes\"]],\r

          \    \"occurrence\":[\"occasionally\",\"Daily\"],\r

          \    \"note\":[\"Happens when i sleep too much without pillow\",\"I barely rest\"]\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Mon, 20 May 2024 21:12:30 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1q mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.16
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "You have successfully added symptoms",
              "data": null
          }

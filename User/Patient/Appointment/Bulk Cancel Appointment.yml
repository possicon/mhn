info:
  name: Bulk Cancel Appointment
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/user/appointments/bulk-cancel"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "appointment_ids" : [
              "a14427af-e505-4c40-a7ad-6c2bcbf8ff75"
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0

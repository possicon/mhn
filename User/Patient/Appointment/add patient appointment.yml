info:
  name: add patient appointment
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/patient/appointment"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"purpose_of_visit\":\"Family Planing\",\r

      \    \"mode_of_appointment\":\"telemedicine\", //walk-in , telemedicine\r

      \    \"type_of_appointment\":\"schedule\",//immediate,schedule\r

      \    \"has_free_consultation\":0,\r

      \    \"for_antenatal\":0,\r

      \    \"for_physiotherapy\":1,\r

      \    \"payment_type\":\"hmo\", //private , hmo, company \r

      \    \"mode\":\"hmo\", // bank_transfer,card,hmo,company,mobile_money\r

      \    \"hmo_id\":\"9bbbac52-edd1-4aa7-8254-c29c14fa6249\",\r

      \    \"hmo_policy_number\":\"KJMMFDKJ83D\",\r

      \    \"patient_id\":\"9ea8d8a4-2cdd-4e08-baaf-a2d7048f8a32\",\r

      \    \"consultation_fee\":\"14043\",\r

      \    \"name\":\"Reliance\", //required if payment type is hmo or company\r

      \    \"plan\":\"gold\", //required if payment type is hmo or company\r

      \    \"policy_number\":\"DDPEIO3J\", //required if payment type is hmo or company\r

      \    \"appointment_date\":\"2024/06/29\",\r

      \    \"company_id\":\"9bf47377-572d-424e-8bb1-a1c09a0e2810\",\r

      \    \"bank_name\":\"GTB\",\r

      \    \"tele_medicine_url\":\"http://www.telemedicine.com\" // required if mode_of_appointment is telemedicine\r

      }"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: add patient
    request:
      url: "{{base_url}}/user/patient/appointment"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"purpose_of_visit\":\"9be982a5-4bda-4d19-8af3-a345ab0f98f0\",\r

          \    \"mode_of_appointment\":\"walk-in\",\r

          \    \"type_of_appointment\":\"immediate\",\r

          \    \"has_free_consultation\":0,\r

          \    \"payment_type\":\"private\",\r

          \    \"patient_id\":\"9c111152-abe1-4490-ab04-c066445133a7\",\r

          \    \"consultation_fee\":\"58560\"\r

          }"

info:
  name: Login - High
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/auth/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          // "email": "contactus@mhn.ng",
          "email": "toheebabiodun03@gmail.com",
          //"username": "0802323232323", // If user has username set, he can log in with it.
          "password":"password"
          // "password":"moyoMhn@35"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.statusText
        if (status === "OK") {
            const token = res.getBody().data.token
            console.log(token)
          bru.setCollectionVar('local_token', token)
          
            
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


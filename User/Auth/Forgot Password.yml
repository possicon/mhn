info:
  name: Forgot Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/user/auth/forgot-password"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"email\": \"stylefinito@gmail.com\", // required if type is email or combined\r

      \    \"phone_number\": \"07060730240\", // required if type is phone or combined\r

      \    \"type\":\"phone\" // email, phone, combined\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Forgot Password
    request:
      url: "{{base_url}}/user/auth/forgot-password"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"email\": \"ikorodu@example.com\", // required if type is email or combined\r

          \    \"phone\": \"08137885678\", // required if type is phone or combined\r

          \    \"type\":\"email\" // email, phone, combined\r

          }"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Thu, 11 Apr 2024 06:13:50 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1q mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.16
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "Password reset OPT have been sent to ikorodu@example.com",
              "data": null
          }

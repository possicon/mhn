info:
  name: Bed stats
  type: http
  seq: 15

http:
  method: GET
  url: "{{base_url}}/user/organization/bed/stats?start_date=2026-03-04"
  params:
    - name: start_date
      value: 2026-03-04
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{base_url}}/user/organization/bed/stats"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Thu, 22 May 2025 18:32:15 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1d mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.17
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "Bed stats retrieved successfully",
              "data": {
                  "total_beds": 10,
                  "total_wards": 3,
                  "total_rooms": 2,
                  "available_beds": 6,
                  "occupied_beds": 3,
                  "reserved_beds": 1
              }
          }
  - name: filter by date
    request:
      url: "{{base_url}}/user/organization/bed/stats?start_date=2026-03-01&end_date=2026-03-02"
      method: GET
      params:
        - name: start_date
          value: 2026-03-01
          type: query
        - name: end_date
          value: 2026-03-02
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Thu, 13 Aug 2026 06:09:25 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "57"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "success": true,
            "code": 0,
            "locale": "en",
            "message": "Bed stats retrieved successfully",
            "data": {
              "total_beds": 0,
              "total_wards": 0,
              "available_beds": 0,
              "occupied_beds": 0,
              "reserved_beds": 0
            }
          }

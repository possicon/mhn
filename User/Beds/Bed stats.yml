info:
  name: Bed stats
  type: http
  seq: 15

http:
  method: GET
  url: "{{base_url}}/user/organization/bed/stats"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{base_url}}/user/organization/bed/stats"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Thu, 22 May 2025 18:32:15 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1d mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.17
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "Bed stats retrieved successfully",
              "data": {
                  "total_beds": 10,
                  "total_wards": 3,
                  "total_rooms": 2,
                  "available_beds": 6,
                  "occupied_beds": 3,
                  "reserved_beds": 1
              }
          }

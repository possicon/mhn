info:
  name: download Sample
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/user/organization/download-sample"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: download sample
    request:
      url: "{{base_url}}/user/organization/download-sample"
      method: GET
      headers:
        - name: Accept
          value: application/json
      body:
        type: multipart-form
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Content-Type
          value: text/csv; charset=UTF-8
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Content-Disposition
          value: attachment; filename=bed_sample.csv
        - name: Cache-Control
          value: no-cache, private
        - name: Date
          value: Thu, 05 Mar 2026 07:50:37 GMT
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "56"
        - name: Vary
          value: Origin
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Content-Type-Options
          value: nosniff
      body:
        type: text
        data: |
          WardName,BedName,Description,Amount,Status
          Ultrasounds,"Bed 1","Bed 1 Desc",,reserved
          X-rays,"Bed 2","Bed 2 Desc",,available
          "Ward 3","Bed 3","Bed 3 Desc",,reserved

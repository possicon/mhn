info:
  name: update reminder
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/user/organization/settings/reminder/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: 9ea84911-f46e-4f6b-b0fc-eaf332bbdc31
      type: path
  body:
    type: json
    data: "{\r

      \    \"alert_time\":\"2_hour\", // 30_mins,1_hour,2_hour\r

      \    \"purpose\":\"prescription\", // prescription,appointment,consultation,surgery,payment\r

      \    \"sms\":true, // true or false or 0 or 1\r

      \    \"email\":true, //  true or false or 0 or 1\r

      \    \"push\":0, //  true or false or 0 or 1\r

      \    \"status\":\"active\",\r

      \    \"description\":\"my reminder\",\r

      \    \"occurrence\":\"due_date\", //daily,weekly_on_mondays,monthly_on_the_fourth_monday,monthly_on_the_last monday,annually,due_date\r

      \    \"due_date_time\":\"2025-04-12 16:05:00\" // if occurrence is due_date\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


info:
  name: Add reminder
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/organization/settings/reminder"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"alert_time\":\"1_hour\", // 30_mins,1_hour,2_hour\r

      \    \"purpose\":\"appointment\", // prescription,appointment,consultation,surgery,payment\r

      \    \"sms\":true, // true or false or 0 or 1\r

      \    \"email\":true, //  true or false or 0 or 1\r

      \    \"push\":0, //  true or false or 0 or 1\r

      \    \"status\":\"active\",\r

      \    \"description\":\"my reminder\",\r

      \    \"occurrence\":\"daily\", //daily,weekly_on_mondays,monthly_on_the_fourth_monday,monthly_on_the_last monday,annually,due_date\r

      \    \"due_date_time\":\"2025-04-12 12:00:00\" // if occurrence is due_date\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Add reminder
    request:
      url: "{{base_url}}/user/organization/settings/reminder"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"alert_time\":\"1 hour\",\r

          \    \"purpose\":\"appointment\", // prescription,appointment,consultation,surgery,payment\r

          \    \"sms\":true, // true or false or 0 or 1\r

          \    \"email\":true, //  true or false or 0 or 1\r

          \    \"push\":0, //  true or false or 0 or 1\r

          \    \"status\":\"active\",\r

          \    \"occurrence\":\"due date\" //daily,weekly on mondays,monthly on the fourth monday,monthly on the last monday,annually,due date\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Mon, 06 May 2024 16:53:29 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1q mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.16
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "You have successfully saved reminder",
              "data": {
                  "item": {
                      "purpose": "appointment",
                      "sms": true,
                      "email": true,
                      "push": false,
                      "occurrence": "due date",
                      "alert_time": "1 hour",
                      "status": "active",
                      "id": "9bfaca78-2eee-4fbf-b501-5288fcb99438",
                      "updated_at": "2024-05-06T16:53:30.000000Z",
                      "created_at": "2024-05-06T16:53:30.000000Z"
                  }
              }
          }

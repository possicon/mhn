info:
  name: Add announcement
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/organization/settings/announcement"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"type\":\"patient\", // select from roles, e.g doctor, nurse, etc\r

      \    \"role_id\" : 1,\r

      \    \"title\":\"General Public Announcement\",\r

      \    \"description\":\"The general public is duly notified of the present economic situation of the country and we ....\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Add announcement
    request:
      url: "{{base_url}}/user/organization/settings/announcement"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: "{\r

          \    \"type\":\"patient\", // select from roles, e.g doctor, nurse, etc\r

          \    \"role_id\" : 1,\r

          \    \"title\":\"General Public Announcement\",\r

          \    \"description\":\"The general public is duly notified of the present economic situation of the country and we ....\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Content-Type
          value: application/json
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Cache-Control
          value: no-cache, private
        - name: Date
          value: Sun, 08 Mar 2026 17:09:04 GMT
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Vary
          value: Origin

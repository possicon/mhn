info:
  name: Add languages
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/organization/settings/language"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"name\":[\"English\",\"French\",\"Igbo\"]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

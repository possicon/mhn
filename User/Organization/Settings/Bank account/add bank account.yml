info:
  name: add bank account
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/organization/settings/bank_account"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"type\":\"Cash\", // bank transfer,card,mobile money\r

      \    \"number\":\"3100317126\",\r

      \    \"bank\":\"First Bank\"\r

      }"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

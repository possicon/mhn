info:
  name: AddService
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/user/organization/service"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"name\":\"Cough Syrup\",\r

      \    \"service_type\":\"pharmacy\", // general,clinical lab,prescription,procedures,x-ray lab,ultraSounds,consultation,bed,pharmacy\r

      \    \"description\":\"Drugs\",\r

      \    \"category\":\"pharmacy\",\r

      \    \"amount\":10000,\r

      \    \"medicine_type\":\"Pill\", // required if \"service_type\":\"pharmacy'\r

      \    \"ward_id\": \"9ed142cb-16ec-41b5-928e-2478c81e4abc\", // required when service type is bed\r

      \    \"status\": \"available\" // required when service type is bed , available or reserved\r

      }"
  auth:
    type: bearer
    token: "{{local_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

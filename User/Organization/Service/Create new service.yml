info:
  name: Create new service
  type: http
  seq: 36

http:
  method: POST
  url: "{{base_url}}/user/organization/services"
  body:
    type: json
    data: |-
      {
        "name" : "{{$randomWord}}",
        "service_type" : "ward_services",
        "description" : "{{$randomLoremSentences}}",
        "category" : "{{$randomWord}}",
        "amount" : 2000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: create a service
    request:
      url: "{{base_url}}/user/organization/services"
      method: POST
      body:
        type: json
        data: |-
          {
            "name" : "{{$randomWord}}",
            "service_type" : "ward_services",
            "description" : "{{$randomLoremSentences}}",
            "category" : "{{$randomWord}}",
            "amount" : 2000
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 14 Aug 2026 17:23:01 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "58"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "success": true,
            "code": 0,
            "locale": "en",
            "message": "Service Created",
            "data": {
              "values": []
            }
          }

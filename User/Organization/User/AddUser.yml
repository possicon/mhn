info:
  name: AddUser
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/user/organization/user/addUser"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: first_name
        type: text
        value: Emma
      - name: last_name
        type: text
        value: Dev
      - name: gender
        type: text
        value: male
      - name: email
        type: text
        value: "{{$randomEmail}}"
      - name: role_id
        type: text
        value: "23"
      - name: phone
        type: text
        value: "08043567890"
      - name: redirect_url
        type: text
        value: http://mhn.net/page
      - name: profile_picture
        type: text
        value: ""
      - name: country_call_code
        type: text
        value: "234"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "{{base_url}}/user/organization/user/addUser"
    request:
      url: "{{base_url}}/user/organization/user/addUser"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: multipart-form
        data:
          - name: first_name
            type: text
            value: Emma
          - name: last_name
            type: text
            value: Dev
          - name: gender
            type: text
            value: male
          - name: email
            type: text
            value: emmadev@gmail.com
          - name: role_id
            type: text
            value: "2"
          - name: phone
            type: text
            value: "08043567890"
          - name: redirect_url
            type: text
            value: http://mhn.net/page
          - name: profile_picture
            type: file
            value:
              - veRni8gPW/IMG-20231127-WA0007.jpg
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Sat, 27 Apr 2024 08:06:12 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1q mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.16
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive

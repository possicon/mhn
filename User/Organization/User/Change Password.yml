info:
  name: Change Password
  type: http
  seq: 10

http:
  method: PUT
  url: "{{base_url}}/user/organization/users/:userId/change-password"
  params:
    - name: userId
      value: a1386445-cd38-49f5-b3c1-bf69e6e7cca4
      type: path
  body:
    type: json
    data: |-
      {
        "new_password" : "password",
        "new_password_confirmation" : "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: example
    request:
      url: "{{base_url}}/user/organization/users/:userId/change-password"
      method: PUT
      params:
        - name: userId
          value: a1386445-cd38-49f5-b3c1-bf69e6e7cca4
          type: path
      body:
        type: json
        data: |-
          {
            "new_password" : "password",
            "new_password_confirmation" : "password"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 02 Sep 2026 06:54:58 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "59"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "success": true,
            "code": 0,
            "locale": "en",
            "message": "Password changed successfully.",
            "data": null
          }

info:
  name: admissions length by ward
  type: http
  seq: 16

http:
  method: GET
  url: "{{base_url}}/user/organization/reports/admissions/average-length-of-stay-by-ward"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:

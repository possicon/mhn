info:
  name: Total Income By service
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/user/organization/reports/income/services"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: sample
    request:
      url: "{{base_url}}/user/organization/reports/income/services"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Wed, 02 Sep 2026 17:17:34 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "57"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "success": true,
            "code": 0,
            "locale": "en",
            "message": "Total Income Fetched By Service",
            "data": {
              "items": [
                {
                  "service_type": "consultation",
                  "total_income": "6400.00",
                  "bill_count": 1
                }
              ]
            }
          }

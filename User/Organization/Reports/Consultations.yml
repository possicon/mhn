info:
  name: Consultations
  type: http
  seq: 15

http:
  method: GET
  url: "{{base_url}}/user/organization/reports/consultations"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: example
    request:
      url: "{{base_url}}/user/organization/reports/consultations"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 01 Sep 2026 17:06:50 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "58"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "success": true,
            "code": 0,
            "locale": "en",
            "message": "Consultations Fetched",
            "data": {
              "items": [
                {
                  "consultation_type": "General Physical Examination",
                  "no_of_consultations": 1,
                  "total_consultations": "6400.00"
                }
              ]
            }
          }

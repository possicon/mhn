          ultrasounds,"MRI or CT Scan","Breast Ultrasound","Male or Female",,
          ultrasounds,"MRI or CT Scan","Cardiac Ultrasound","Male or Female",,
          X-rays,"MRI or CT Scan","Chest X-Ray","Male or Female",,
          X-rays,"MRI or CT Scan","Dental X-Ray","Male or Female",,
          X-rays,"MRI or CT Scan","Extremity X-Ray","Male or Female",,
          Ultrasounds,"MRI or CT Scan",Facilitator,"Male or Female",,

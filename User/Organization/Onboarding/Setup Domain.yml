info:
  name: Setup Domain
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/user/organization/onboarding/domain-setup"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"domain\": \"pinnacles\", // unique string - min 3\r

      \    \"email\": \"pinnacles\", // if customised is 1 then email must be a valid email\r

      \    \"customized\": 1, //0 or 1\r

      \   \"incoming_server\":\"https://google.com\", //required if customised is true\r

      \   \"outgoing_server\":\"https://mhn.net\" //required if customised is true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


info:
  name: update profile picture
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/user/profile/picture"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: profile_picture
        type: file
        value:
          - /home/lawpavilion/Videos/sun_facts/sun.jpg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: profile picture
    request:
      url: "{{base_url}}/user/profile/picture"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: multipart-form
        data:
          - name: profile_picture
            type: file
            value:
              - /home/lawpavilion/Videos/sun_facts/sun.jpg
            contentType: image/jpeg
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.24.0 (Ubuntu)
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Tue, 25 Aug 2026 10:32:05 GMT
        - name: x-ratelimit-limit
          value: "60"
        - name: x-ratelimit-remaining
          value: "56"
        - name: vary
          value: Origin
        - name: x-frame-options
          value: SAMEORIGIN
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
      body:
        type: json
        data: |-
          {
            "status": true,
            "message": "Profile Picture Updated"
          }

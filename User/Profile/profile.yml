  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/user/profile"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: search
      value: select ward
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


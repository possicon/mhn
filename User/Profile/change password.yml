info:
  name: change password
  type: http
  seq: 2

http:
  method: PUT
  url: "{{base_url}}/user/change-password"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
          "old_password" : "new_password",
          "new_password" : "password",
          "new_password_confirmation" : "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: change password
    request:
      url: "{{base_url}}/user/change-password"
      method: PUT
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
              "old_password" : "new_password",
              "new_password" : "password",
              "new_password_confirmation" : "password"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Content-Type
          value: application/json
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Cache-Control
          value: no-cache, private
        - name: Date
          value: Thu, 16 Jul 2026 18:29:01 GMT
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "56"
        - name: Vary
          value: Origin
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Content-Type-Options
          value: nosniff
      body:
        type: json
        data: |-
          {
              "status": true,
              "message": "Password updated successfully"
          }

info:
  name: download csv sample
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/user/organization/wards/download-sample"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /home/lawpavilion/Videos/wards.csv
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: download csv sample
    request:
      url: "{{base_url}}/user/organization/wards/download-sample"
      method: GET
      headers:
        - name: Accept
          value: application/json
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value:
              - /home/lawpavilion/Videos/wards.csv
            disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.24.0 (Ubuntu)
        - name: Content-Type
          value: text/csv; charset=UTF-8
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Content-Disposition
          value: attachment; filename=ward_sample.csv
        - name: Cache-Control
          value: no-cache, private
        - name: Date
          value: Thu, 05 Mar 2026 07:37:54 GMT
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Vary
          value: Origin
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: X-Content-Type-Options
          value: nosniff
      body:
        type: text
        data: |
          name,description
          Ultrasounds,"Description 1"
          X-rays,"Description 2"
          "Ward 3","Ward 3 description"

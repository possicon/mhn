info:
  name: smsStats
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/user/organization/smsStats"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: ownerStats Copy
    request:
      url: "{{base_url}}/user/organization/smsStats"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Thu, 16 Jan 2025 10:26:16 GMT
        - name: Server
          value: Apache/2.4.54 (Win64) OpenSSL/1.1.1d mod_fcgid/2.3.10-dev
        - name: X-Powered-By
          value: PHP/8.2.17
        - name: Cache-Control
          value: no-cache, private
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Vary
          value: Authorization
        - name: Keep-Alive
          value: timeout=5, max=100
        - name: Connection
          value: Keep-Alive
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "success": true,
              "code": 0,
              "locale": "en",
              "message": "SMS statistics retrieved successfully.",
              "data": {
                  "total_sms_sent": 1,
                  "total_credits": "400.00"
              }
          }

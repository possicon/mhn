info:
  name: send claim to hmo
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/user/organization/hmoClaim/send"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: hmo_id
        type: text
        value: 9bbbac52-edd1-4aa7-8254-c29c14fa6249
      - name: file
        type: file
        value:
          - QQQgSUFB0/PhysincalExamination.pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

info:
  name: "view xray Result "
  type: http
  seq: 21

http:
  method: GET
  url: "{{base_url}}/user/lab/:xray/tests/:test/viewResult"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: test
      value: 01a0f338-bc2d-7163-934a-928ad64551df
      type: path
    - name: xray
      value: 01a0f338-bc29-73f3-a684-6b0dc8f4d654
      type: path
  auth: inherit

settings:

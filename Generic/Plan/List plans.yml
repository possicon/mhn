info:
  name: List plans
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/generic/plan?skip=0&take=1&search=plan&active=0&page=1"
  params:
    - name: skip
      value: "0"
      type: query
    - name: take
      value: "1"
      type: query
    - name: search
      value: plan
      type: query
    - name: active
      value: "0"
      type: query
    - name: type
      value: temporary
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successfully retrived plans", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

info:
  name: Add Permission
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/admin/permissions"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: ""
      value: ""
      disabled: true
  body:
    type: form-urlencoded
    data:
      - name: name
        value: Delete admin
      - name: guard_name
        value: admin
      - name: group_name
        value: admin
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: import csv
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/admin/icd10/import"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /Users/possicon/Herd/backend/icd.csv
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

info:
  name: download sample
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/admin/user/upload_sample/download"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: "{\r

      \    \"type\":\"csv\" //csv or excel\r

      }"
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

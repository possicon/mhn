info:
  name: Upload excel
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/admin/user/bulk-upload"
  headers:
    - name: Accept
      value: multipart/form-data
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - UTdkuV0IC/account_import_sample.xlsx
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Upload excel
    request:
      url: "{{base_url}}/admin/bulk-upload"
      method: POST
      headers:
        - name: Accept
          value: multipart/form-data
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value:
              - /C:/Users/MY PC/Downloads/plans.xlsx
            description: excel or csv

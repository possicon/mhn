info:
  name: Create Region
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/admin/region"
  body:
    type: json
    data: "{\r

      \  \"name\": \"Africa\",\r

      \  \"code\": \"AFR\",\r

      \  \"description\":\"This is Africa\"\r

      }"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


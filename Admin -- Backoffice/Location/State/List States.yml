http:
  method: GET
  url: "{{base_url}}/admin/state?country_id=9bb5e95c-833f-41b0-ac8e-2efb5bccfd55&active=1"
  params:
    - name: country_id
      value: 9bb5e95c-833f-41b0-ac8e-2efb5bccfd55
      type: query
    - name: active
      value: "1"
      type: query
      description: 1 or 0
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


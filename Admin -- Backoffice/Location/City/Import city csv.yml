info:
  name: Import city csv
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/admin/city/import"
  headers:
    - name: Accept
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - tY2ooSrHF/city_sample.csv
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

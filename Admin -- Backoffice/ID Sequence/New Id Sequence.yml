http:
  method: POST
  url: "{{base_url}}/admin/idSequence"
  body:
    type: json
    data: "{\r

      \    \"code\":\"MHN_USA\",\r

      \    \"country_id\":\"9b9faee3-6aaa-4050-bd6c-98a43e674250\",\r

      \    \"max_record\":500,\r


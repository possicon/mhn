info:
  name: Edit Plan
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/admin/plan/:id"
  params:
    - name: id
      value: 16a141d2-a239-45e7-9994-cf2869222b7c
      type: path
  body:
    type: json
    data: "{\r

      \    \"name\": \"Test Plan 1!\",\r

      \    \"type\": \"temporary\",\r

      \    \"number_of_users\": 5,\r

      \    \"pricing_per_user\": 3003,\r

      \    \"start_date\": \"2026-03-30\",\r

      \    \"end_date\": \"2026-10-30\"\r

      \    \r

      }"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successfully created plan", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Edit Plan
    request:
      url: "{{base_url}}/admin/plan/:id"
      method: PATCH
      params:
        - name: id
          value: 1a1a1a1a-1a1a-1a1a-1a1a-1a1a1a1a1a11
          type: path
      body:
        type: json
        data: "{\r

          \    \"name\": \"Plan Name\",\r


info:
  name: Activate or deactivate multiple plans
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/admin/plan/toggleStatus"
  body:
    type: json
    data: "{\r

      \    \"plan_ids\": [\"1a1a1a1a-1a1a-1a1a-1a1a-1a1a1a1a1a11\",\"1a1a1a1a-1a1a-1a1a-1a1a-1a1a1a1a1a12\"]\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


info:
  name: Search Plans
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/admin/plan/search"
  body:
    type: json
    data: "{\r

      \    \"name\":\"plan\",\r

      \    \"skip\":0,\r

      \    \"take\":50\r

      }"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successfully searched plans", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

info:
  name: List plans in admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/admin/plan?filter=Plan B"
  params:
    - name: skip
      value: "0"
      type: query
      disabled: true
    - name: take
      value: "50"
      type: query
      disabled: true
    - name: search
      value: Plan A
      type: query
      disabled: true
    - name: filter
      value: Plan B
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successfully retrived plans", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


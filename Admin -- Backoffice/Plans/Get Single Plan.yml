info:
  name: Get Single Plan
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/admin/plan/:planId"
  params:
    - name: planId
      value: 16a141d2-a239-45e7-9994-cf2869222b7c
      type: path
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successfully searched plans", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


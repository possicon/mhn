info:
  name: Filter plans in admin
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}/admin/plan?active=true&type=temporary&skip=0&take=50"
  params:
    - name: active
      value: "true"
      type: query
    - name: type
      value: temporary
      type: query
    - name: skip
      value: "0"
      type: query
    - name: take
      value: "50"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Successfully retrived plans", function () {
            expect(res.getStatus()).to.be.oneOf([200, 201]);
        });

settings:

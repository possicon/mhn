info:
  name: Fetch Payment Methods
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/admin/paymentMethod"
  params:
    - name: collectionType
      value: Cash
      type: query
      disabled: true
    - name: status
      value: active
      type: query
      disabled: true
    - name: country
      value: Ghana
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

